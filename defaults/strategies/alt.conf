# name: ALT
# description: fake + fakedsplit, autottl, badseq
# tcp: 80,443
# udp: 443
--filter-udp=443 {hostlist} --dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic={fake_quic}
--new
--filter-tcp=80 {hostlist} --dpi-desync=fake,fakedsplit --dpi-desync-autottl=2 --dpi-desync-fooling=md5sig
--new
--filter-tcp=443 {hostlist} --dpi-desync=fake,fakedsplit --dpi-desync-split-pos=1 --dpi-desync-autottl --dpi-desync-fooling=badseq --dpi-desync-repeats=8 --dpi-desync-fake-tls={fake_tls}
