# name: ALT2
# description: multisplit с seqovl=652 и шаблоном ClientHello
# tcp: 80,443
# udp: 443
--filter-udp=443 {hostlist} --dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic={fake_quic}
--new
--filter-tcp=80 {hostlist} --dpi-desync=fake,multisplit --dpi-desync-autottl=2 --dpi-desync-fooling=md5sig
--new
--filter-tcp=443 {hostlist} --dpi-desync=multisplit --dpi-desync-split-seqovl=652 --dpi-desync-split-pos=2 --dpi-desync-split-seqovl-pattern={fake_tls}
