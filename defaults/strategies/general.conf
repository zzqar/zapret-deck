# name: General
# description: fake + multidisorder по midsld, QUIC fake (аналог general)
# tcp: 80,443
# udp: 443
--filter-udp=443 {hostlist} --dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic={fake_quic}
--new
--filter-tcp=80 {hostlist} --dpi-desync=fake,multisplit --dpi-desync-autottl=2 --dpi-desync-fooling=md5sig
--new
--filter-tcp=443 {hostlist} --dpi-desync=fake,multidisorder --dpi-desync-split-pos=midsld --dpi-desync-repeats=8 --dpi-desync-fooling=md5sig,badseq --dpi-desync-fake-tls={fake_tls}
