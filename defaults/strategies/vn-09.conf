# name: VN · fake,fakedsplit autottl rnd
# description: альтернативный вариант для TCP, если основная не помогает
# tcp: 80,443
# udp: 443
--filter-tcp=80,443 {hostlist} {exclude} {autohostlist} --hostlist-auto-fail-threshold=2
--dpi-desync=fake,fakedsplit --dpi-desync-autottl=5 --dpi-desync-split-pos=1 --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com
--new
--filter-udp=443 {hostlist} {exclude} --dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic={fake_quic}
