# name: TTL 4
# description: fake с низким TTL + multidisorder (если провайдер режет md5sig)
# tcp: 80,443
# udp: 443
--filter-udp=443 {hostlist} --dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-ttl=4 --dpi-desync-fake-quic={fake_quic}
--new
--filter-tcp=80,443 {hostlist} --dpi-desync=fake,multidisorder --dpi-desync-ttl=4 --dpi-desync-split-pos=1,midsld --dpi-desync-fake-tls={fake_tls}
