# name: General + Discord voice
# description: general + голос Discord (UDP 50000-50100, STUN) и порты Cloudflare
# tcp: 80,443,2053,2083,2087,2096,8443
# udp: 443,19294-19344,50000-50100
--filter-udp=443 {hostlist} --dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic={fake_quic}
--new
--filter-udp=19294-19344,50000-50100 --filter-l7=discord,stun --dpi-desync=fake --dpi-desync-repeats=6
--new
--filter-tcp=80 {hostlist} --dpi-desync=fake,multisplit --dpi-desync-autottl=2 --dpi-desync-fooling=md5sig
--new
--filter-tcp=443,2053,2083,2087,2096,8443 {hostlist} --dpi-desync=fake,multidisorder --dpi-desync-split-pos=midsld --dpi-desync-repeats=8 --dpi-desync-fooling=md5sig,badseq --dpi-desync-fake-tls={fake_tls}
