# name: ALT3 (fake TLS auto)
# description: fake с модифицированным ClientHello (sni=www.google.com), badsum
# tcp: 80,443
# udp: 443
--filter-udp=443 {hostlist} --dpi-desync=fake --dpi-desync-repeats=11 --dpi-desync-fake-quic={fake_quic}
--new
--filter-tcp=80 {hostlist} --dpi-desync=fake,multisplit --dpi-desync-autottl=2 --dpi-desync-fooling=md5sig
--new
--filter-tcp=443 {hostlist} --dpi-desync=fake,multidisorder --dpi-desync-split-pos=1,midsld --dpi-desync-repeats=11 --dpi-desync-fooling=badsum --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com
