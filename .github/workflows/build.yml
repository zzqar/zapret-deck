name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pnpm install
      - run: pnpm build
      - name: Package
        run: |
          mkdir -p out/zapret-deck
          cp -R dist main.py plugin.json package.json defaults py_modules LICENSE README.md out/zapret-deck/
          cd out && zip -r zapret-deck.zip zapret-deck
      - uses: actions/upload-artifact@v4
        with:
          name: zapret-deck
          path: out/zapret-deck.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/zapret-deck.zip
          generate_release_notes: true
