name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Backend smoke test
        run: python3 tests/smoke.py
      - run: pnpm install
      - run: pnpm build
      - name: Package
        run: |
          mkdir -p out/zapret-deck
          cp -R dist main.py plugin.json package.json defaults py_modules LICENSE README.md out/zapret-deck/
          cd out && zip -r zapret-deck.zip zapret-deck
      - uses: actions/upload-artifact@v4
        with:
          name: zapret-deck
          path: out/zapret-deck.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/zapret-deck.zip
          body_path: INSTALL.md
      - name: Prepare Pages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p site
          cp out/zapret-deck.zip site/z.zip
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Zapret Deck</title>
          <p>Zapret Deck ${GITHUB_REF_NAME}. Decky → Developer → Install Plugin from URL:</p>
          <pre>https://zzqar.github.io/zapret-deck/z.zip</pre>
          <p><a href="https://github.com/zzqar/zapret-deck">github.com/zzqar/zapret-deck</a></p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
